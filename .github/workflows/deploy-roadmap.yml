name: Deploy Preview
on:
  push:
    branches: [main]
    paths-ignore: [".claude/**"]

permissions:
  contents: read
  packages: write

jobs:
  infra:
    uses: gmautner/locaweb-cloud-provision/.github/workflows/provision.yml@v1
    with:
      env_name: "roadmap"
      zone: "ZP02"
      accessories: '[{"name":"db","plan":"medium","disk_size_gb":20}]'
    secrets:
      CLOUDSTACK_API_KEY: ${{ secrets.CLOUDSTACK_API_KEY }}
      CLOUDSTACK_SECRET_KEY: ${{ secrets.CLOUDSTACK_SECRET_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy:
    needs: infra
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Load infrastructure environment
        run: echo "${{ needs.infra.outputs.infra_env }}" >> "$GITHUB_ENV"

      - name: Set repo identity
        run: |
          echo "REPO_NAME=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "REPO_FULL=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - uses: crazy-max/ghaction-github-runtime@v3

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - run: gem install kamal --no-document

      # Trava de segurança: faz backup do banco de produção ANTES de publicar a
      # nova versão. Salva o dump em /data/backups na VM do banco (disco com
      # snapshot diário) e o disponibiliza como artefato deste run.
      # No primeiro deploy de um ambiente novo o container do banco ainda não
      # existe — nesse caso o passo é pulado de propósito. Em um ambiente com
      # banco existente, se o backup falhar o deploy é abortado.
      - name: Backup database before deploy
        run: |
          set -euo pipefail
          DB_IP="${INFRA_DB_IP:-}"
          if [ -z "$DB_IP" ]; then
            echo "::notice::INFRA_DB_IP vazio — sem banco a copiar; pulando backup."
            exit 0
          fi
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30"
          if ! ssh $SSH_OPTS root@"$DB_IP" "docker ps --format '{{.Names}}' | grep -qx '${REPO_NAME}-db'"; then
            echo "::notice::Container ${REPO_NAME}-db ainda não existe (primeiro deploy?) — pulando backup."
            exit 0
          fi
          TS=$(date +%Y%m%d-%H%M%S)
          DUMP="/data/backups/predeploy-${TS}.dump"
          echo "Gerando backup em $DUMP na VM do banco ($DB_IP)…"
          ssh $SSH_OPTS root@"$DB_IP" "mkdir -p /data/backups && docker exec ${REPO_NAME}-db pg_dump -U postgres -Fc postgres > '$DUMP'"
          # Valida o dump (lista o conteúdo) e traz uma cópia para o runner.
          ssh $SSH_OPTS root@"$DB_IP" "docker exec -i ${REPO_NAME}-db pg_restore --list < '$DUMP' > /dev/null && ls -lh '$DUMP'"
          mkdir -p backup-artifact
          scp $SSH_OPTS root@"$DB_IP":"$DUMP" "backup-artifact/predeploy-${TS}.dump"
          echo "BACKUP_TS=$TS" >> "$GITHUB_ENV"
          echo "::notice::Backup do banco concluído: $DUMP (cópia anexada como artefato)."

      - name: Upload database backup artifact
        if: env.BACKUP_TS != ''
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.BACKUP_TS }}
          path: backup-artifact/*.dump
          retention-days: 90

      - name: Deploy with Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kamal proxy boot -d roadmap || kamal proxy reboot -y -d roadmap || true
          kamal setup -d roadmap
          kamal accessory reboot all -d roadmap

      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.REPO_NAME }}
          package-type: container
          min-versions-to-keep: 1
