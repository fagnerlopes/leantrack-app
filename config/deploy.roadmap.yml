servers:
  web:
    hosts:
      - <%= ENV['INFRA_WEB_IP'] %>

env:
  clear:
    APP_ENV: roadmap
    BASE_URL: https://roadmaplwsa.kinghost.net
    SEED_ADMIN_EMAIL: admin@kinghost.com.br
  secret:
    - DATABASE_URL
    - JWT_SECRET
    - SEED_ADMIN_PASSWORD
    - TURNSTILE_SITE_KEY
    - TURNSTILE_SECRET_KEY

# O domínio oficial é roadmaplwsa.kinghost.net. O endereço nip.io fica na lista
# como rede de segurança: continua atendendo enquanto o DNS propaga e se o
# domínio apresentar problema. Cada host recebe seu próprio certificado
# Let's Encrypt (desafio HTTP-01), então ambos precisam resolver para esta VM.
proxy:
  hosts:
    - roadmaplwsa.kinghost.net
    - <%= ENV['INFRA_WEB_IP'] %>.nip.io
  ssl: true

accessories:
  db:
    image: supabase/postgres:17.6.1.129
    host: <%= ENV['INFRA_DB_IP'] %>
    port: "5432:5432"
    cmd: "postgres -D /etc/postgresql -c shared_buffers=1GB -c effective_cache_size=3GB -c work_mem=10MB -c maintenance_work_mem=256MB -c max_connections=100"
    env:
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /data/pgdata:/var/lib/postgresql/data
