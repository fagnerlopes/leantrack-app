<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeanTrack</title>
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100vh; }
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
      *, *::before, *::after { box-sizing: border-box; }

      /* Layout "app shell" da tela de roadmap: a página não rola — apenas a
         lista de iniciativas rola dentro do quadro, mantendo a régua de datas,
         o header, os filtros e a legenda sempre visíveis. Ver ADR 017. */
      .rm-shell { height: 100dvh; overflow: hidden; }
      .rm-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .rm-gantt-card { height: 100%; display: flex; flex-direction: column; }
      .rm-gantt-scroll { flex: 1; min-height: 0; overflow: auto; }

      /* Alças de ajuste de datas nas pontas da barra da iniciativa: aparecem
         ao passar o mouse pela barra, ao focar pelo teclado ou durante o
         arrasto. Ficam escondidas no resto do tempo para o quadro continuar
         limpo — e nas exportações de PNG/PDF. Ver ADR 018. */
      .rm-bar-handle { opacity: 0; transition: opacity 0.12s ease; }
      .rm-bar-wrap:hover .rm-bar-handle,
      .rm-bar-wrap[data-dragging="true"] .rm-bar-handle,
      .rm-bar-handle:focus-visible { opacity: 1; }
      .rm-bar-handle:focus-visible { outline: 2px solid #6366f1; outline-offset: 1px; border-radius: 3px; }

      /* Em telas de toque não existe "passar o mouse": as alças ficam sempre
         visíveis, senão não haveria como alcançá-las. */
      @media (hover: none) {
        .rm-bar-handle { opacity: 1; }
      }

      /* Telas pequenas: com pouca altura — ou pouca largura, onde cabeçalho e
         filtros quebram em várias linhas e comem a altura útil — a lista
         viraria uma janelinha de 3 ou 4 linhas. Nesses casos a página volta a
         rolar por inteiro (comportamento anterior) e a régua deixa de ser fixa.
         O piso é ~320px de área para a lista. */
      @media (max-height: 600px), (max-width: 700px) {
        .rm-shell { height: auto; min-height: 100vh; overflow: visible; }
        .rm-main { flex: 0 0 auto; min-height: auto; }
        .rm-gantt-card { height: auto; }
        .rm-gantt-scroll { flex: 0 0 auto; min-height: auto; overflow-y: visible; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
